  </head><body data-demo-page="01_home_device_binding" class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-md text-headline-md text-on-surface tracking-tight">Devices</span></div><div class="flex items-center gap-space-sm"><button aria-label="Search" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-surface-variant/40 transition-colors text-on-surface"><span class="material-symbols-outlined text-[22px]">search</span></button><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-20 bg-surface min-h-screen"><div class="flex flex-col w-full h-[calc(100vh-9rem)] justify-between px-margin py-space-sm overflow-hidden select-none">

<button class="group relative w-full bg-gradient-to-b from-primary-container/20 to-primary-container/10 hover:from-primary-container/30 hover:to-primary-container/15 active:scale-[0.98] transition-all duration-200 rounded-[28px] p-space-lg flex flex-col items-center text-center shadow-[0_12px_32px_-8px_rgba(121,89,0,0.12)]" id="pairCardBtn">
<!-- Gentle Ambient Radial Glow -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-40 h-40 bg-primary-container/20 rounded-full blur-2xl pointer-events-none"></div>

<div class="relative w-20 h-20 rounded-[22px] bg-surface-container-lowest shadow-[0_8px_20px_-4px_rgba(65,55,30,0.1)] flex items-center justify-center mb-space-md group-hover:scale-105 transition-transform duration-300">
<!-- Golden + Icon -->

<div class="absolute inset-0 rounded-[22px] bg-primary-container/20 scale-100 opacity-0 pointer-events-none transition-all duration-700" id="beaconRing"></div>
</div>
<!-- Card Copy -->
<span class="font-title-md text-title-md text-on-surface group-hover:text-primary transition-colors">
        Add wearable devices
      </span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-1 max-w-[210px]">

      </span>

</div>
</button>

<script>
  (function() {
    // Select active tab on device route
    const currentNavLinks = document.querySelectorAll('nav a');
    currentNavLinks.forEach(link => {
      const isDevice = link.getAttribute('data-path') === 'devices';
      if (isDevice) {
        link.classList.remove('text-on-surface/60');
        link.classList.add('text-on-surface', 'font-semibold', 'scale-105');
        const icon = link.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.style.fontVariationSettings = "'FILL' 1";
        }
      } else {
        link.classList.remove('text-on-surface', 'font-semibold', 'scale-105');
        link.classList.add('text-on-surface/60');
        const icon = link.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.style.fontVariationSettings = "'FILL' 0";
        }
      }
    });

    // Tactile feedback on Add Card
    const btn = document.getElementById('pairCardBtn');
    const ring = document.getElementById('beaconRing');
    const scanStatus = document.getElementById('scanStatus');
    const scanText = document.getElementById('scanText');

    let isScanning = false;

    if (btn) {
      btn.addEventListener('click', () => {
        if (isScanning) return;
        isScanning = true;

        // Visual pulse ring animation
        if (ring) {
          ring.classList.remove('scale-100', 'opacity-0');
          ring.classList.add('scale-125', 'opacity-100');
          setTimeout(() => {
            ring.classList.remove('scale-125', 'opacity-100');
            ring.classList.add('scale-100', 'opacity-0');
          }, 600);
        }

        // Show scanning text feedback
        if (scanStatus) {
          scanStatus.classList.remove('opacity-0');
          scanText.textContent = "Scanning for CareSole & SafeTag...";
          setTimeout(() => {
            scanText.textContent = "Hold device close to your iPhone";
          }, 1800);
          setTimeout(() => {
            scanStatus.classList.add('opacity-0');
            isScanning = false;
          }, 4200);
        }
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-primary-container shadow-[0_-4px_16px_rgba(0,0,0,0.08)]" data-active-classes="text-on-surface font-semibold scale-105"><div class="flex justify-around items-center h-16 px-gutter"><a aria-current="page" class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] transition-all text-on-surface font-semibold scale-105" data-path="devices" href="#"><span class="material-symbols-outlined text-[24px]">steps</span><span class="font-label-sm text-label-sm mt-0.5 tracking-normal">Devices</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface/60 transition-all hover:text-on-surface" data-path="alerts" href="#"><span class="material-symbols-outlined text-[24px]">radar</span><span class="font-label-sm text-label-sm mt-0.5 tracking-normal">Alerts</span></a><a class="flex flex-col items-center justify-center min-w-[56px] min-h-[44px] text-on-surface/60 transition-all hover:text-on-surface" data-path="community" href="#"><span class="material-symbols-outlined text-[24px]">shield_person</span><span class="font-label-sm text-label-sm mt-0.5 tracking-normal">Community</span></a></div></nav><script src="../assets/interactions.js"></script></body></html>
