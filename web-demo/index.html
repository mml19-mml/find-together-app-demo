<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find Together App Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#eeede8;font:13px system-ui;color:#4f4633}header{padding:12px;background:#fbf9f1;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}button,select{padding:8px;border:1px solid #d3c5ac;border-radius:8px;background:#fbf9f1;color:#4f4633}iframe{width:390px;height:884px;border:0;display:block;margin:20px auto;background:#fbf9f1;box-shadow:0 10px 40px #0002}footer{text-align:center;padding:12px;font-size:11px}.app header,.app footer{display:none}.app iframe{margin:0;width:100%;height:100dvh;box-shadow:none}@media(max-width:420px){iframe{width:100%;margin:0;height:884px}}</style><body><header><b>Find Together · 原 UI 演示</b><select id="pages" aria-label="页面选择"></select><button id="restart">重新体验</button></header><iframe id="app" title="App 演示"></iframe><footer id="status">硬件、位置、通知与身份核验均为模拟。AI 未接入此界面。</footer><script src="assets/catalog.js"></script><script>
if(new URLSearchParams(location.search).has('app'))document.body.classList.add('app');
const app=document.getElementById('app'),select=document.getElementById('pages');let state={bound:false,posts:[]};for(let id of catalog){let option=document.createElement('option');option.value=id;option.textContent=id;select.append(option)}function go(id){if(!catalog.includes(id))return;select.value=id;app.src='pages/'+id+'.html'}select.onchange=()=>go(select.value);document.getElementById('restart').onclick=()=>{state={bound:false,posts:[]};go(catalog[0])};window.addEventListener('message',e=>{if(e.source!==app.contentWindow||!e.data?.findTogether)return;let m=e.data;if(m.type==='navigate')go(m.page);if(m.type==='state')Object.assign(state,m.patch);if(m.type==='ready')app.contentWindow.postMessage({findTogether:true,type:'restore',state},'*');if(m.type==='notice')document.getElementById('status').textContent=m.text});go('onboarding_1_safety_monitoring');
</script></body></html>
